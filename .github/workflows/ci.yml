name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test, typecheck, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Set up JDK 21 for Firestore Emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test production server
        run: |
          npm start -- --hostname 127.0.0.1 --port 3100 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3100/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Block high and critical production advisories
        run: npm audit --omit=dev --audit-level=high

  android:
    name: Android unit test, R8 release, and benchmark build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Create non-secret CI Android configuration
        run: |
          printf '%s\n' \
            'sdk.dir=${{ env.ANDROID_HOME }}' \
            'apiBaseUrl=https://example.invalid' \
            'googleWebClientId=' > android/local.properties
          printf '%s' '{"project_info":{"project_number":"1234567890","project_id":"giftcondoctor-ci","storage_bucket":"giftcondoctor-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:0000000000000000","android_client_info":{"package_name":"com.giftcondoctor.app"}},"oauth_client":[],"api_key":[{"current_key":"ci-placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
      - name: Run Android verification
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :benchmark:assembleBenchmark
