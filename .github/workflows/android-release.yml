name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "서명 검증만 수행하거나 실제 Release를 발행합니다."
        required: true
        default: signing-dry-run
        type: choice
        options:
          - signing-dry-run
          - release

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  PROJECT_SLUG: gifticon-doctor
  DASHBOARD_REPO: wjdals988/mydashboard
  DASHBOARD_DATA_FILE: src/lib/projects.json
  BUILD_TOOLS_VERSION: 35.0.0
  DEFAULT_API_BASE_URL: https://giftcondoctor.vercel.app
  EXPECTED_PACKAGE_NAME: com.giftcondoctor.app
  EXPECTED_FIREBASE_PROJECT_ID: giftcondoctor
  EXPECTED_RELEASE_CERT_SHA256: 3b4a7f1f68e5c4977fd5fe625534529c86d8f025770def4119bce4451c8fb0ad

jobs:
  build:
    name: Test, build, sign, and verify
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      asset_name: ${{ steps.metadata.outputs.asset_name }}
      size_label: ${{ steps.metadata.outputs.size_label }}
      sha256: ${{ steps.metadata.outputs.sha256 }}
      release_url: ${{ steps.metadata.outputs.release_url }}
      download_url: ${{ steps.metadata.outputs.download_url }}
    steps:
      - name: Validate invocation mode
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$RELEASE_MODE" in
            signing-dry-run)
              echo "Signing dry-run: Release and dashboard jobs will remain disabled."
              ;;
            release)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "A real release is allowed only from main, not $GITHUB_REF."
                exit 1
              fi
              ;;
            *)
              echo "Unsupported mode: $RELEASE_MODE"
              exit 1
              ;;
          esac
      - name: Checkout app repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Validate build secrets
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_GOOGLE_WEB_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_WEB_CLIENT_ID }}
          DASHBOARD_UPDATE_TOKEN: ${{ secrets.DASHBOARD_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in GOOGLE_SERVICES_JSON_BASE64 ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD ANDROID_GOOGLE_WEB_CLIENT_ID
          do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "$RELEASE_MODE" = "release" ] && [ -z "$DASHBOARD_UPDATE_TOKEN" ]; then
            missing+=("DASHBOARD_UPDATE_TOKEN")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required secrets: %s\n' "${missing[*]}"
            exit 1
          fi
      - name: Validate dashboard write access
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          can_push="$(gh api "repos/$DASHBOARD_REPO" --jq '.permissions.push // false')"
          if [ "$can_push" != "true" ]; then
            echo "DASHBOARD_UPDATE_TOKEN cannot push to $DASHBOARD_REPO."
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;${BUILD_TOOLS_VERSION}"
      - name: Restore Firebase and signing files
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
          ANDROID_GOOGLE_WEB_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          keystore_path="$RUNNER_TEMP/giftcondoctor-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_RELEASE_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"
          api_base_url="${ANDROID_API_BASE_URL:-$DEFAULT_API_BASE_URL}"
          if [ "$api_base_url" != "$DEFAULT_API_BASE_URL" ]; then
            echo "Release APK must use the production API: $DEFAULT_API_BASE_URL"
            exit 1
          fi
          jq -e --arg package_name "$EXPECTED_PACKAGE_NAME" \
            '.client[] | select(.client_info.android_client_info.package_name == $package_name)' \
            android/app/google-services.json >/dev/null
          jq -e --arg project_id "$EXPECTED_FIREBASE_PROJECT_ID" \
            '.project_info.project_id == $project_id' android/app/google-services.json >/dev/null
          jq -e --arg client_id "$ANDROID_GOOGLE_WEB_CLIENT_ID" \
            '.client[].oauth_client[]? | select(.client_type == 3 and .client_id == $client_id)' \
            android/app/google-services.json >/dev/null
          keystore_cert_sha256="$(keytool -list -v \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          if [ "$keystore_cert_sha256" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "Release keystore certificate SHA-256 mismatch."
            echo "Expected: $EXPECTED_RELEASE_CERT_SHA256"
            echo "Actual:   ${keystore_cert_sha256:-missing}"
            exit 1
          fi
          printf '%s\n' \
            "sdk.dir=$ANDROID_HOME" \
            "apiBaseUrl=$api_base_url" \
            "googleWebClientId=$ANDROID_GOOGLE_WEB_CLIENT_ID" > android/local.properties
      - name: Read and validate Android version
        id: version
        run: |
          set -euo pipefail
          version_name="$(grep -E 'versionName\s*=' android/app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          version_code="$(grep -E 'versionCode\s*=' android/app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')"
          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "versionName must be SemVer x.y.z: $version_name"
            exit 1
          fi
          if ! [[ "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "versionCode must be a positive integer: $version_code"
            exit 1
          fi
          previous_tag="$(git tag --sort=-v:refname | head -n 1)"
          if [ -n "$previous_tag" ]; then
            previous_file="$(git show "${previous_tag}:android/app/build.gradle.kts")"
            previous_name="$(printf '%s\n' "$previous_file" | grep -E 'versionName\s*=' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
            previous_code="$(printf '%s\n' "$previous_file" | grep -E 'versionCode\s*=' | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')"
            if [ "$version_code" -le "$previous_code" ]; then
              echo "versionCode must increase: $version_code <= $previous_code ($previous_tag)"
              exit 1
            fi
            if [ "$(printf '%s\n%s\n' "$previous_name" "$version_name" | sort -V | tail -n 1)" != "$version_name" ] || [ "$version_name" = "$previous_name" ]; then
              echo "versionName must increase: $version_name <= $previous_name ($previous_tag)"
              exit 1
            fi
          fi
          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "release_tag=v$version_name"
          } >> "$GITHUB_OUTPUT"
      - name: Test and build release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Sign release APK and prepare metadata
        id: metadata
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/release/giftcondoctor-${VERSION_NAME}-${VERSION_CODE}-release.apk"
          asset_name="giftcondoctor-${VERSION_NAME}-${VERSION_CODE}-release-signed.apk"
          asset_path="dist/$asset_name"
          aligned_apk="dist/giftcondoctor-${VERSION_NAME}-${VERSION_CODE}-release-aligned.apk"
          test -f "$source_apk"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign" -p -f 4 "$source_apk" "$aligned_apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign \
            --ks "$ANDROID_RELEASE_KEYSTORE" \
            --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_RELEASE_STORE_PASSWORD" \
            --key-pass "pass:$ANDROID_RELEASE_KEY_PASSWORD" \
            --out "$asset_path" "$aligned_apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$asset_path"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign" -c -v 4 "$asset_path" >/dev/null
          apk_cert_sha256="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" \
            verify --print-certs "$asset_path" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr '[:upper:]' '[:lower:]')"
          if [ "$apk_cert_sha256" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "Signed APK certificate SHA-256 mismatch."
            echo "Expected: $EXPECTED_RELEASE_CERT_SHA256"
            echo "Actual:   ${apk_cert_sha256:-missing}"
            exit 1
          fi
          size_bytes="$(stat -c%s "$asset_path")"
          size_label="$(printf '%s bytes' "$(printf "%'d" "$size_bytes")")"
          sha256="$(sha256sum "$asset_path" | awk '{print $1}')"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset_name}"
          {
            echo "asset_name=$asset_name"
            echo "asset_path=$asset_path"
            echo "size_label=$size_label"
            echo "sha256=$sha256"
            echo "release_url=$release_url"
            echo "download_url=$download_url"
          } >> "$GITHUB_OUTPUT"
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-apk-${{ github.run_id }}
          path: ${{ steps.metadata.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 7
      - name: Write signing summary
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SHA256: ${{ steps.metadata.outputs.sha256 }}
        run: |
          {
            echo "## Android signing result"
            echo ""
            echo "- mode: \`$RELEASE_MODE\`"
            echo "- source: \`$GITHUB_REF@$GITHUB_SHA\`"
            echo "- version: \`$VERSION_NAME ($VERSION_CODE)\`"
            echo "- certificate SHA-256: \`$EXPECTED_RELEASE_CERT_SHA256\`"
            echo "- APK SHA-256: \`$SHA256\`"
            if [ "$RELEASE_MODE" = "signing-dry-run" ]; then
              echo "- publish: disabled (no tag, Release, or dashboard change)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish immutable GitHub Release
    needs: build
    if: needs.build.result == 'success' && inputs.mode == 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-apk-${{ github.run_id }}
          path: dist
      - name: Refuse an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists. Bump versionName/versionCode instead of overwriting $RELEASE_TAG."
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists. Bump versionName/versionCode instead of moving $RELEASE_TAG."
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          ASSET_NAME: ${{ needs.build.outputs.asset_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          SIZE_LABEL: ${{ needs.build.outputs.size_label }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            '기프티콘닥터 Android release APK입니다.' \
            '' \
            '> 중요: 이 버전은 새 서명 인증서로 전환되어 v0.1.12를 덮어쓸 수 없습니다.' \
            '> 기존 사용자는 가능하면 먼저 로그아웃한 뒤 기존 앱 삭제 → 새 APK 설치 → 재로그인이 필요합니다.' \
            '> 앱 삭제 시 로컬 데이터는 지워지며 Firebase 계정 데이터는 재로그인 후 다시 조회됩니다.' \
            '' \
            "- versionName: $VERSION_NAME" \
            "- versionCode: $VERSION_CODE" \
            "- fileName: $ASSET_NAME" \
            "- size: $SIZE_LABEL" \
            "- SHA256: $SHA256" > "$notes_file"
          gh release create "$RELEASE_TAG" "dist/$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "기프티콘닥터 $RELEASE_TAG" \
            --notes-file "$notes_file"

  dashboard:
    name: Update dashboard after release
    needs: [build, publish]
    if: needs.publish.result == 'success' && inputs.mode == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Validate dashboard token
        env:
          DASHBOARD_UPDATE_TOKEN: ${{ secrets.DASHBOARD_UPDATE_TOKEN }}
        run: test -n "$DASHBOARD_UPDATE_TOKEN"
      - name: Checkout dashboard repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DASHBOARD_REPO }}
          token: ${{ secrets.DASHBOARD_UPDATE_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - name: Update dashboard APK metadata
        run: |
          npm run update:apk -- \
            --slug "$PROJECT_SLUG" \
            --url "${{ needs.build.outputs.download_url }}" \
            --fileName "${{ needs.build.outputs.asset_name }}" \
            --version "${{ needs.build.outputs.version_name }}" \
            --versionCode "${{ needs.build.outputs.version_code }}" \
            --size "${{ needs.build.outputs.size_label }}" \
            --sha256 "${{ needs.build.outputs.sha256 }}" \
            --releaseUrl "${{ needs.build.outputs.release_url }}"
      - name: Commit dashboard update
        run: |
          set -euo pipefail
          if git diff --quiet -- "$DASHBOARD_DATA_FILE"; then
            echo "Dashboard data already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DASHBOARD_DATA_FILE"
          git commit -m "Update gifticon-doctor APK to ${{ needs.build.outputs.release_tag }}"
          git push
