name: Firestore Rules and Indexes Rollback

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "복원할 main 조상 commit SHA 또는 tag"
        required: true
        type: string
      scope:
        description: "복원 범위"
        required: true
        default: rules
        type: choice
        options:
          - rules
          - rules-and-indexes
      execute:
        description: "검증 후 production에 실제 반영"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "실행 시 ROLLBACK FIRESTORE RULES 또는 ROLLBACK FIRESTORE RULES AND INDEXES"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: firestore-production-change
  cancel-in-progress: false

env:
  FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"

jobs:
  validate:
    name: Resolve, diff, and test rollback snapshot
    runs-on: ubuntu-24.04
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      scope: ${{ steps.resolve.outputs.scope }}
      execute: ${{ steps.resolve.outputs.execute }}
    steps:
      - name: Require workflow execution from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow from main. Current ref: $GITHUB_REF"
            exit 1
          fi
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and constrain target
        id: resolve
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          ROLLBACK_SCOPE: ${{ inputs.scope }}
          EXECUTE: ${{ inputs.execute }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]; then
            echo "target_ref contains unsupported characters."
            exit 1
          fi
          target_sha="$(git rev-parse --verify "${TARGET_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$target_sha" "$GITHUB_SHA"; then
            echo "Target must be the current main commit or one of its ancestors."
            exit 1
          fi
          git cat-file -e "${target_sha}:firebase/firestore.rules"
          git cat-file -e "${target_sha}:firebase/firestore.indexes.json"

          if [ "$EXECUTE" = "true" ]; then
            expected="ROLLBACK FIRESTORE RULES"
            if [ "$ROLLBACK_SCOPE" = "rules-and-indexes" ]; then
              expected="ROLLBACK FIRESTORE RULES AND INDEXES"
            fi
            if [ "$CONFIRMATION" != "$expected" ]; then
              echo "Confirmation mismatch. Expected: $expected"
              exit 1
            fi
          fi

          {
            echo "target_sha=$target_sha"
            echo "scope=$ROLLBACK_SCOPE"
            echo "execute=$EXECUTE"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Set up JDK 21 for Firestore Emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build immutable rollback artifact
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          ROLLBACK_SCOPE: ${{ steps.resolve.outputs.scope }}
        run: |
          set -euo pipefail
          mkdir -p rollback-artifact/firebase
          git show "${TARGET_SHA}:firebase/firestore.rules" > rollback-artifact/firebase/firestore.rules
          if [ "$ROLLBACK_SCOPE" = "rules-and-indexes" ]; then
            git show "${TARGET_SHA}:firebase/firestore.indexes.json" > rollback-artifact/firebase/firestore.indexes.json
          else
            cp firebase/firestore.indexes.json rollback-artifact/firebase/firestore.indexes.json
          fi
          jq -n '{firestore: {rules: "firebase/firestore.rules", indexes: "firebase/firestore.indexes.json"}}' \
            > rollback-artifact/firebase.json
          jq empty rollback-artifact/firebase/firestore.indexes.json
          rules_sha="$(sha256sum rollback-artifact/firebase/firestore.rules | awk '{print $1}')"
          indexes_sha="$(sha256sum rollback-artifact/firebase/firestore.indexes.json | awk '{print $1}')"
          jq -n \
            --arg targetSha "$TARGET_SHA" \
            --arg sourceMainSha "$GITHUB_SHA" \
            --arg scope "$ROLLBACK_SCOPE" \
            --arg rulesSha256 "$rules_sha" \
            --arg indexesSha256 "$indexes_sha" \
            '{targetSha: $targetSha, sourceMainSha: $sourceMainSha, scope: $scope, rulesSha256: $rulesSha256, indexesSha256: $indexesSha256}' \
            > rollback-artifact/manifest.json
          {
            echo "## Firestore rollback plan"
            echo "- Current main: \`$GITHUB_SHA\`"
            echo "- Target: \`$TARGET_SHA\`"
            echo "- Scope: \`$ROLLBACK_SCOPE\`"
            echo "- Execute: \`${{ inputs.execute }}\`"
            echo "- Target index count: \`$(jq '.indexes | length' rollback-artifact/firebase/firestore.indexes.json)\`"
            echo
            echo '```diff'
            git diff "$GITHUB_SHA" "$TARGET_SHA" -- firebase/firestore.rules firebase/firestore.indexes.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Firebase tooling
        working-directory: backend
        run: npm ci
      - name: Validate target rules against current security regressions
        run: |
          set -euo pipefail
          cp rollback-artifact/firebase/firestore.rules firebase/firestore.rules
          cp rollback-artifact/firebase/firestore.indexes.json firebase/firestore.indexes.json
          npm --prefix backend run test:rules
      - name: Upload reviewed rollback artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestore-rollback-${{ steps.resolve.outputs.target_sha }}
          path: rollback-artifact/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy approved rollback snapshot
    if: needs.validate.outputs.execute == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - name: Download exact validated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firestore-rollback-${{ needs.validate.outputs.target_sha }}
          path: rollback-artifact
      - name: Verify downloaded artifact identity and hashes
        env:
          EXPECTED_TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          EXPECTED_SCOPE: ${{ needs.validate.outputs.scope }}
        run: |
          set -euo pipefail
          test "$(jq -r '.targetSha' rollback-artifact/manifest.json)" = "$EXPECTED_TARGET_SHA"
          test "$(jq -r '.scope' rollback-artifact/manifest.json)" = "$EXPECTED_SCOPE"
          rules_sha="$(sha256sum rollback-artifact/firebase/firestore.rules | awk '{print $1}')"
          indexes_sha="$(sha256sum rollback-artifact/firebase/firestore.indexes.json | awk '{print $1}')"
          test "$rules_sha" = "$(jq -r '.rulesSha256' rollback-artifact/manifest.json)"
          test "$indexes_sha" = "$(jq -r '.indexesSha256' rollback-artifact/manifest.json)"
      - name: Checkout tooling lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: source/backend/package-lock.json
      - name: Install pinned Firebase tooling
        working-directory: source/backend
        run: npm ci
      - name: Restore scoped Firebase credential
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "FIREBASE_PROJECT_ID variable and FIREBASE_SERVICE_ACCOUNT_BASE64 secret are required."
            exit 1
          fi
          credential_path="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$credential_path"
          chmod 600 "$credential_path"
          jq -e '.type == "service_account" and (.project_id | length > 0)' "$credential_path" >/dev/null
          credential_project="$(jq -r '.project_id' "$credential_path")"
          if [ "$credential_project" != "$FIREBASE_PROJECT_ID" ]; then
            echo "Credential project does not match FIREBASE_PROJECT_ID."
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_path" >> "$GITHUB_ENV"
          echo "DEPLOY_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
      - name: Cloud dry-run against approved project
        env:
          ROLLBACK_SCOPE: ${{ needs.validate.outputs.scope }}
        run: |
          set -euo pipefail
          targets="firestore:rules"
          if [ "$ROLLBACK_SCOPE" = "rules-and-indexes" ]; then
            targets="firestore:rules,firestore:indexes"
          fi
          source/backend/node_modules/.bin/firebase deploy \
            --project "$DEPLOY_PROJECT_ID" \
            --config rollback-artifact/firebase.json \
            --only "$targets" \
            --dry-run \
            --non-interactive
      - name: Deploy exact approved snapshot
        env:
          ROLLBACK_SCOPE: ${{ needs.validate.outputs.scope }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          targets="firestore:rules"
          force=()
          if [ "$ROLLBACK_SCOPE" = "rules-and-indexes" ]; then
            targets="firestore:rules,firestore:indexes"
            force=(--force)
          fi
          source/backend/node_modules/.bin/firebase deploy \
            --project "$DEPLOY_PROJECT_ID" \
            --config rollback-artifact/firebase.json \
            --only "$targets" \
            --message "Rollback to $TARGET_SHA" \
            --non-interactive \
            "${force[@]}"
      - name: Capture post-deploy index evidence
        run: |
          set -euo pipefail
          source/backend/node_modules/.bin/firebase firestore:indexes \
            --project "$DEPLOY_PROJECT_ID" > rollback-artifact/deployed-indexes.json
          jq empty rollback-artifact/deployed-indexes.json
      - name: Upload deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestore-rollback-evidence-${{ needs.validate.outputs.target_sha }}
          path: rollback-artifact/
          if-no-files-found: error
          retention-days: 30
